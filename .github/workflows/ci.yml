name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - name: Migrations apply cleanly (PGlite)
        run: npm run db:check
      - name: Content lint (no "tutor", no "holiday tuition", no hard-coded ratings in pages)
        run: |
          if grep -rniE '\btutors?\b|holiday tuition' src --include='*.ts' --include='*.tsx'; then
            echo "::error::Forbidden copy: never 'tutor' or 'holiday tuition'"; exit 1
          fi
          if grep -rnE 'rating_avg: [0-9]' src/app src/components; then
            echo "::error::Ratings must come from stored records, not page code"; exit 1
          fi
      - run: npm run build
